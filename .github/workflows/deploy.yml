# One promotion stage, called by pipeline.yml once per environment:
#   1. pin the image digest in k8s-keda-poc's apps/pulse-api/overlays/<stage>
#   2. have Argo CD (auto-sync) pick it up now, wait until that exact
#      commit is Synced + Healthy
#   3. e2e against the live deployment (scripts/e2e.sh)
#
# Runs on the self-hosted runner, which provides the argocd/kustomize CLIs
# and ARGOCD_SERVER/ARGOCD_PASSWORD (k8s-keda-poc's runner/Dockerfile and
# docker-compose.yaml), and reaches each cluster's NodePort by hostname.
name: Deploy

on:
  workflow_call:
    inputs:
      stage:
        description: internal, stg or prod
        type: string
        required: true
      digest:
        description: Image digest to deploy (sha256:...)
        type: string
        required: true
    secrets:
      GITOPS_SSH_KEY:
        description: Private half of a write deploy key on glexposito/k8s-keda-poc
        required: true

jobs:
  deploy:
    name: deploy
    runs-on: [self-hosted, local-k8s]
    env:
      STAGE: ${{ inputs.stage }}
      DIGEST: ${{ inputs.digest }}
      IMAGE: ghcr.io/${{ github.repository }}
      APP: pulse-api-${{ inputs.stage }}

    steps:
      - name: Checkout pulse-api
        uses: actions/checkout@v7

      - name: Checkout GitOps repo
        uses: actions/checkout@v7
        with:
          repository: glexposito/k8s-keda-poc
          # GITHUB_TOKEN can't write to another repo, even one you own - a
          # deploy key is scoped to k8s-keda-poc alone and isn't tied to any
          # user account.
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          path: gitops

      - name: Pin image digest
        id: pin
        working-directory: gitops
        run: |
          (cd "apps/pulse-api/overlays/$STAGE" && kustomize edit set image "$IMAGE@$DIGEST")

          if git diff --quiet; then
            echo "$STAGE already pinned to $DIGEST - nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "pulse-api: deploy $DIGEST to $STAGE" \
              -m "From ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            # Someone else may have pushed to the GitOps repo meanwhile.
            for attempt in 1 2 3; do
              git push && break
              [ "$attempt" = 3 ] && exit 1
              git pull --rebase
            done
          fi

          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Argo CD
        working-directory: gitops
        env:
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          argocd login "$ARGOCD_SERVER" --username admin --password "$ARGOCD_PASSWORD" --insecure
          # The app auto-syncs; --refresh makes Argo CD see the new commit now
          # instead of on its ~3 min poll. Then wait until what it deployed
          # includes our commit (it may be a newer one, if something else was
          # pushed meanwhile) - not an older revision that was already Synced.
          argocd app get "$APP" --refresh > /dev/null
          includes_ours() {
            deployed=$(argocd app get "$APP" -o json | jq -r .status.sync.revision)
            git fetch -q origin "$deployed" 2>/dev/null
            git merge-base --is-ancestor "$REVISION" "$deployed" 2>/dev/null
          }
          for _ in $(seq 1 60); do includes_ours && break; sleep 5; done
          argocd app wait "$APP" --sync --health --timeout 300
          includes_ours || { echo "Argo CD is on $deployed, which doesn't include $REVISION"; exit 1; }

      - name: E2E
        run: ./scripts/e2e.sh "http://k3s-$STAGE:30080"

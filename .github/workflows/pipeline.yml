# Build only: pushes the app image and its Playwright e2e image (e2e/) to
# GHCR with the same sha-<short> tag. Promotion internal -> stg -> prod is
# Kargo's job, in gitops-poc: its Warehouse picks up each matching pair,
# deploys the app stage by stage, and runs the e2e image against each
# deployment before the next stage (gitops-poc docs/kargo.md).
name: Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per commit on main at a time.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The Playwright e2e tests (e2e/) as an image, same sha-<short> tag as
      # the app, so Kargo verifies each build with the tests from its own
      # commit.
      - name: Extract e2e image metadata
        id: meta-e2e
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-e2e
          tags: |
            type=sha

      - name: Build and push e2e image
        uses: docker/build-push-action@v7
        with:
          context: ./e2e
          push: true
          tags: ${{ steps.meta-e2e.outputs.tags }}
          labels: ${{ steps.meta-e2e.outputs.labels }}

